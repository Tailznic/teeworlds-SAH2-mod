# SAH - Stole and Hook (based on FNG2)
#
# Rules:
#  - The hook replaces the laser: hooking an enemy freezes him (sv_hit_freeze seconds) and pulls him to you
#  - The hook never freezes teammates: hooking a frozen teammate rescues (unfreezes) him
#  - Re-hooking a frozen enemy does not refresh the freeze timer (you just drag him)
#  - Steal: kill (spike throw) an enemy that was frozen by someone else ->
#      +n points: 60% for the killer, 40% for the freezer (rounded), +n for the killer's team
#  - Throw your OWN frozen enemy into spikes (any spike) -> -n for you and -n for your team
#  - A steal-throw into your own team spikes -> -n for you and -n for your team
#  - A teammate throwing his own frozen mate -> the victim just dies, no points
#  - Duel fallback (sv_sah_duel_fallback): a team with a single active player
#      scores +n by throwing his own frozen enemies into enemy/neutral spikes
#  - Weapons: hammer (smashing) + a toy gun that does nothing, no laser

#Server Name
sv_name "SAH - Stole and Hook Server"

#Server Rcon Password
sv_rcon_password rconpassword

# Server Gametype
sv_gametype SAH

# Map name
sv_map "AliveFNG"

# Enable /emote command and wheel
#sv_emote_wheel 1
#sv_emotional_tees 1

# high bandwidth, for smoother gaming
sv_high_bandwidth 1

sv_inactivekick_time 20

# Server password
# password serverpassword

# Register to master server
sv_register 1

sv_tournament_mode 0

# Max Clients, that can connect to this server
sv_max_clients 16
sv_spectator_slots 0

# Server port
sv_port 8340

sv_max_clients_per_ip 4

# Server Motd info (info text when joining the server)
sv_motd "SAH - Stole and Hook\n\nHook freezes enemies (10s) and pulls them to you.\nHook your frozen teammates to rescue them!\nSteal kills: throw enemies frozen by others into THEIR team spikes for points (60/40).\nThrowing your own frozen enemy = -points for you and your team."

# hammer "power", don't edit if not wanted
# sv_hammer_scale_x 320
# sv_hammer_scale_y 120
# sv_melt_hammer_scale_x 50
# sv_melt_hammer_scale_y 50

# the seconds a player is frozen by a hook
# sv_hit_freeze 10

# duel fallback: self-throws score positive for single-player teams
# sv_sah_duel_fallback 1

# scorelimit
sv_scorelimit 1000

#add some votes
add_vote "map AliveFNG" "sv_map AliveFNG"
add_vote "map openfng5Beat" "sv_map openfng5Beat"
add_vote "map IIT_Edited" "sv_map IIT_Edited"
add_vote "Scorelimit 200" "sv_scorelimit 200"
add_vote "Scorelimit 300" "sv_scorelimit 300"
add_vote "Scorelimit 500" "sv_scorelimit 500"
add_vote "Scorelimit 700" "sv_scorelimit 700"
add_vote "Scorelimit 1000" "sv_scorelimit 1000"
add_vote "Restart" "restart 5"
add_vote "1o1" "sv_spectator_slots 14"
add_vote "2o2" "sv_spectator_slots 12"
add_vote "3o3" "sv_spectator_slots 10"
add_vote "4o4" "sv_spectator_slots 8"
add_vote "5o5" "sv_spectator_slots 6"
add_vote "6o6" "sv_spectator_slots 4"
add_vote "7o7" "sv_spectator_slots 2"
add_vote "8o8" "sv_spectator_slots 0"
add_vote "Shuffle Teams" "shuffle_teams"
