# SAH - Stole and Hook (based on FNG2)
#
# Rules:
#  - The hook replaces the laser: hooking an enemy freezes him (sv_hit_freeze seconds) and pulls him to you
#  - The hook never freezes teammates: shooting a frozen teammate with the pistol unfreezes him (2 shots)
#  - Re-hooking a frozen enemy does not refresh the freeze timer (you just drag him)
#  - Steal: kill (spike throw) an enemy that was frozen by someone else ->
#      +n points: 60% for the killer, 40% for the freezer (rounded), +n for the killer's team
#  - Throw your OWN frozen enemy into spikes -> -n for you and -n for your team
#  - A steal-throw into your own team spikes -> -n for you and -n for your team
#  - A teammate throwing his own frozen mate -> the victim just dies, no points
#  - Pistol: pushes enemies like a hammer and unfreezes teammates
#  - Personal self-kill protection: /sp - you cannot hook your own frozen victim
#  - No hammer, no laser

#Server Name
sv_name "SAH - Stole and Hook Server"

#Server Rcon Password
sv_rcon_password rconpassword

# Server Gametype
sv_gametype SAH

# Map name
sv_map "AliveFNG"

# Enable /emote command and wheel
#sv_emote_wheel 1
#sv_emotional_tees 1

# high bandwidth, for smoother gaming
sv_high_bandwidth 1

sv_inactivekick_time 20

# Server password
# password serverpassword

# Register to master server
sv_register 1

sv_tournament_mode 0

# Max Clients, that can connect to this server
sv_max_clients 16
sv_spectator_slots 0

# Server port

sv_max_clients_per_ip 1

# Server Motd info (info text when joining the server)
sv_motd "SAH - Stole and Hook\n\nКрюк заменяет лазер: цепляя врага — замораживаешь его.\nПистолет отталкивает врагов и размораживает тиммейтов (2 выстрела).\nКража: закинь врага, замороженного ДРУГИМ, в шипы его команды — получишь очки (60/40).\nСвой замороженный в шипы = -очки тебе и команде.\nЗащита от кражи своего: /sp"

# scorelimit (max 2000)
sv_scorelimit 2000

# SAH settings
# shot-заморозка тиммейта
# sv_sah_shots_to_unfreeze 2
# инверсия убийств (1 = свои дают -n, 0 = как в FNG дают +n)
# sv_sah_inversion 1
# штраф для команды в процентах (50 = половина)
# sv_sah_team_penalty 50
# защита от кражи своего (глобально)
# sv_sah_self_kill_protect 1
# дуэль-фоллбек
# sv_sah_duel_fallback 1
# лимит очков (0 = без, макс 2000)
# sv_sah_score_limit 2000

#add some votes
add_vote "Карта: AliveFNG" "sv_map AliveFNG"
add_vote "Карта: openfng5Beat" "sv_map openfng5Beat"
add_vote "Карта: IIT_Edited" "sv_map IIT_Edited"
add_vote "Лимит очков: 500" "sv_scorelimit 500"
add_vote "Лимит очков: 1000" "sv_scorelimit 1000"
add_vote "Лимит очков: 1500" "sv_scorelimit 1500"
add_vote "Лимит очков: 2000" "sv_scorelimit 2000"
add_vote "Рестарт" "restart 5"
add_vote "Инверсия убийств: ВКЛ" "sv_sah_inversion 1"
add_vote "Инверсия убийств: ВЫКЛ" "sv_sah_inversion 0"
add_vote "Хук-отскок: ВКЛ" "sv_sah_hookable_hook 1"
add_vote "Хук-отскок: ВЫКЛ" "sv_sah_hookable_hook 0"
add_vote "Перемешать команды" "shuffle_teams"
