# fng_trainbot: the server to record real human throws on.
# Connect a client to localhost:8303 and play — every throw, spike kill, rescue
# and death is written to human_throws.log with the input that produced it.
# The bots are off so they cannot get in the way of what you are showing.

sv_name "FNG throw recorder"
sv_gametype fng2
sv_map "fng"
sv_port 8303
sv_max_clients 16
sv_register 0
sv_tournament_mode 0

# no bots — this run is about your play, not theirs
sv_bot_count 0
sv_bot_learn 0

# the recorder
sv_bot_throwlog 1
sv_bot_trace_freeze 0
sv_bot_debug 0

logfile "human_throws.log"
